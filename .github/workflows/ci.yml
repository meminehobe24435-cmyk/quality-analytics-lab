name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show dependency versions
        run: python -m qalab info

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run full pipeline (single command)
        run: python -m qalab run --out reports

      - name: Assert required artifacts exist
        shell: python
        run: |
          import pathlib, sys

          # Windows runner 的控制台默认不是 UTF-8（charmap），
          # 直接 print 中文文件名（实验报告.md）会抛 UnicodeEncodeError 而让 CI 变红。
          for stream in (sys.stdout, sys.stderr):
              try:
                  stream.reconfigure(encoding="utf-8", errors="replace")
              except (AttributeError, ValueError):
                  pass

          out = pathlib.Path("reports")
          required = [
              "metrics.json",
              "\u5b9e\u9a8c\u62a5\u544a.md",
              "factor_ranking.csv",
              "model_comparison.csv",
              "significance_tests.csv",
              "cluster_profile.csv",
              "run_meta.json",
          ]
          missing = [n for n in required if not (out / n).exists()]
          pngs = sorted(p.name for p in out.glob("*.png"))
          if missing:
              sys.exit(f"missing artifacts: {missing}")
          if len(pngs) < 15:
              sys.exit(f"expected >= 15 figures, got {pngs}")
          expected_figures = [
              "01_label_balance.png",
              "09_model_comparison.png",
              "10_cluster_selection.png",
              "14_regression_predicted_vs_actual.png",
              "15_timeseries_trend.png",
          ]
          absent = [n for n in expected_figures if n not in pngs]
          if absent:
              sys.exit(f"expected figures missing: {absent}")
          sizes = {p.name: p.stat().st_size for p in out.glob("*.png")}
          empty = {k: v for k, v in sizes.items() if v < 3000}
          if empty:
              sys.exit(f"figures look empty: {empty}")
          print("artifacts OK:", required)
          print("figures:", pngs)

      - name: Verify reproducibility (two runs must be byte-identical)
        run: python tools/check_reproducibility.py --n-perm 200

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn
