name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show dependency versions
        run: python -m qalab info

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run full pipeline (single command)
        run: python -m qalab run --out reports

      - name: Assert required artifacts exist
        shell: python
        run: |
          import pathlib, sys
          out = pathlib.Path("reports")
          required = [
              "metrics.json", "实验报告.md", "factor_ranking.csv",
              "model_comparison.csv", "significance_tests.csv", "run_meta.json",
          ]
          missing = [n for n in required if not (out / n).exists()]
          pngs = sorted(p.name for p in out.glob("*.png"))
          if missing:
              sys.exit(f"missing artifacts: {missing}")
          if len(pngs) < 9:
              sys.exit(f"expected >= 9 figures, got {pngs}")
          sizes = {p.name: p.stat().st_size for p in out.glob("*.png")}
          empty = {k: v for k, v in sizes.items() if v < 3000}
          if empty:
              sys.exit(f"figures look empty: {empty}")
          print("artifacts OK:", required)
          print("figures:", pngs)

      - name: Verify reproducibility (two runs must be byte-identical)
        run: python tools/check_reproducibility.py --n-perm 200

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn
