[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-analytics-lab"
version = "0.1.0"
description = "面向制造业质量数据的分析工作台：多源异构质量数据的数据质量检查、显著因子识别、统计检验与不合格预测建模"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "meminehobe24435-cmyk" }]
keywords = ["data-quality", "quality-engineering", "manufacturing", "pandas", "scikit-learn"]
dependencies = [
    "pandas>=3.0,<4",
    "numpy>=2.0,<3",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<1",
    "scikit-learn>=1.7,<2",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
qalab = "qalab.cli:main"

[tool.setuptools]
packages = ["qalab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
